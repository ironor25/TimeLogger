services:
  # ----------------------------------------------------
  # 1. NestJS Backend API Service
  # ----------------------------------------------------
  - type: web
    name: pulsetime-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: pulsetime-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRES
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES
        value: 7d
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: ./uploads
      - key: SEED_DATABASE
        value: "true"
      - key: API_BASE_URL
        fromService:
          name: pulsetime-api
          type: web
          property: host
          format: https://{host}

  # ----------------------------------------------------
  # 2. Next.js Admin Panel Frontend Service
  # ----------------------------------------------------
  - type: web
    name: pulsetime-web
    env: docker
    dockerfilePath: ./Dockerfile.web
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: pulsetime-api
          type: web
          property: host
          format: https://{host}

# ----------------------------------------------------
# 3. PostgreSQL Database
# ----------------------------------------------------
databases:
  - name: pulsetime-db
    databaseName: pulsetime
    user: pulsetime
    plan: free
    region: oregon
