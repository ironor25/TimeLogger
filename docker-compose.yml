services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsetime_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pulsetime}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pulsetime_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulsetime"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulsetime_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - pulsetime_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional MinIO S3 service (PulseTime defaults to local disk storage in ./uploads)
  minio:
    profiles:
      - s3
    image: quay.io/minio/minio:latest
    container_name: pulsetime_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - pulsetime_miniodata:/data

volumes:
  pulsetime_pgdata:
    driver: local
  pulsetime_redisdata:
    driver: local
  pulsetime_miniodata:
    driver: local
